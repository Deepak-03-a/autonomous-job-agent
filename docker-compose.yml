services:
  job-agent-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sastra_job_agent_api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://talentalign:change-me@host.docker.internal:5432/talentalign
      OLLAMA_URL: http://host.docker.internal:11434
    restart: unless-stopped
