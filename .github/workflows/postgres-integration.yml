name: PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main, linked_in_fetch]

jobs:
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: talentalign_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talentalign_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentalign_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest "psycopg[binary]>=3.2,<4" "pgvector>=0.3,<1"
      - run: PYTHONPATH=backend pytest -q backend/tests/test_postgres_integration.py
